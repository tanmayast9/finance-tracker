[program:flask-finance]
directory=/path/to/finance
command=/path/to/venv/bin/gunicorn -c gunicorn_config.py run:app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/flask-finance.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/flask-finance-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=FLASK_ENV=production,DATABASE_URL=mysql+pymysql://user:pass@localhost/finance_db
stopsignal=TERM
stopasgroup=true
priority=999
