<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Finance Manager</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .auth-card { max-width: 420px; width: 100%; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--silver); }
        .auth-tabs button { flex: 1; padding: 0.75rem; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--silver-mid); }
        .auth-tabs button.active { color: var(--black); border-bottom: 2px solid var(--black); margin-bottom: -2px; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-error { color: var(--black); font-size: 0.9rem; margin-bottom: 1rem; }
        .auth-link { text-align: center; margin-top: 1rem; }
        .auth-link a { color: var(--black); text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card card">
            <div class="navbar-brand" style="justify-content: center; margin-bottom: 1.5rem;">
                <span class="logo">💰</span>
                <h1>Finance Manager</h1>
            </div>
            <p id="openHint" style="display: none; font-size: 0.85rem; color: var(--silver-mid); text-align: center; margin-bottom: 1rem;">Open this page at <strong>http://localhost:5000/login.html</strong> and start the server with <code>python run.py</code>.</p>
            <div class="auth-tabs">
                <button type="button" id="tabLogin" class="active" onclick="showAuthTab('login')">Login</button>
                <button type="button" id="tabSignup" onclick="showAuthTab('signup')">Sign up</button>
            </div>
            <div id="authError" class="auth-error" style="display: none;"></div>

            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Log in</button>
            </form>

            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" required placeholder="johndoe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password (8+ chars, uppercase letter and number)</label>
                    <input type="password" id="signupPassword" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[A-Z]).{8,}" title="Use at least 8 characters, including a letter, a number, and an uppercase letter." placeholder="Min 8 characters, e.g. Finance2026">
                </div>
                <div class="form-group">
                    <label>Full name (optional)</label>
                    <input type="text" id="signupFullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <select id="signupCurrency">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="CAD">CAD ($)</option>
                        <option value="AUD">AUD ($)</option>
                        <option value="CHF">CHF (Fr)</option>
                        <option value="CNY">CNY (¥)</option>
                        <option value="SGD">SGD ($)</option>
                        <option value="AED">AED (د.إ)</option>
                        <option value="ZAR">ZAR (R)</option>
                        <option value="BRL">BRL (R$)</option>
                        <option value="MXN">MXN ($)</option>
                        <option value="KRW">KRW (₩)</option>
                        <option value="PLN">PLN (zł)</option>
                        <option value="SEK">SEK (kr)</option>
                        <option value="NOK">NOK (kr)</option>
                        <option value="DKK">DKK (kr)</option>
                        <option value="THB">THB (฿)</option>
                        <option value="PHP">PHP (₱)</option>
                        <option value="IDR">IDR (Rp)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Create account</button>
            </form>
        </div>
    </div>
    <script>
        const API_BASE = (window.location.port === '5000' && /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname) ? '' : 'http://localhost:5000') + '/api';
        if (window.location.protocol === 'file:') {
            document.getElementById('openHint').style.display = 'block';
        }
        function showAuthTab(tab) {
            document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('tab' + (tab === 'login' ? 'Login' : 'Signup')).classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            document.getElementById('authError').style.display = 'none';
        }
        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.style.display = 'block';
        }
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            showError('');
            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const msg = data.error || data.message || (res.status >= 500 ? 'Server error. Try again.' : 'Login failed.');
                    showError(msg);
                    return;
                }
                const token = data.token;
                if (!token) {
                    showError('Invalid response from server (no token).');
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                showError('Cannot connect to the server. Open this page at http://localhost:5000/login.html and run the app with: python run.py');
            }
        }
        async function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const email = (document.getElementById('signupEmail').value || '').trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const full_name = document.getElementById('signupFullName').value.trim();
            const currency = document.getElementById('signupCurrency').value;
            showError('');
            if (!/^(?=.*[A-Za-z])(?=.*\d)(?=.*[A-Z]).{8,}$/.test(password)) {
                showError('Password must be at least 8 characters and include a letter, a number, and an uppercase letter.');
                return;
            }
            try {
                const res = await fetch(API_BASE + '/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, full_name, currency })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const msg = data.error || data.message || (res.status >= 500 ? 'Server error. Try again.' : 'Sign up failed.');
                    showError(msg);
                    return;
                }
                const token = data.token;
                if (!token) {
                    showError('Account created but invalid response (no token). Please log in.');
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                showError('Cannot connect to the server. Open this page at http://localhost:5000/login.html and run the app with: python run.py');
            }
        }
    </script>
</body>
</html>
